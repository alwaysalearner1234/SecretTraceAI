name: SecretTrace Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secrettrace:
    name: SecretTrace AI Git History Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is CRITICAL because SecretTrace scans the entire commit history.
          # Shallow clones do not contain previous commits where secrets were committed and deleted.
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run SecretTrace Security Audit
        run: |
          export PYTHONPATH="."
          python scanner/cli.py . --history --fail-on high
